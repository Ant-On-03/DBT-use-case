version: 2

models:
  - name: dim_stations
    description: "Type 1 Dimension table containing all Citi Bike stations."
    columns:
      - name: station_id
        description: "Primary key for the station."
        tests:
          - unique
          - not_null

      - name: station_name
        description: "Public name of the station."
        tests:
          - not_null

      - name: station_lat
        description: "Latitude coordinate of the station."
        tests:
          - not_null