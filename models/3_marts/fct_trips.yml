version: 2

models:
  - name: fct_trips
    description: "Core Fact table containing individual Citi Bike trips."
    columns:
      - name: trip_id
        description: "Primary key of the trip."
        tests:
          - unique
          - not_null

      - name: started_at
        description: "Timestamp when the trip started. Used for table partitioning."
        tests:
          - not_null

      - name: start_station_id
        description: "Foreign key to dim_stations for the start location."
        tests:
          - not_null
          # Enforce that every trip in the fact table connects to a valid station in your dimension
          - relationships:
              to: ref('dim_stations')
              field: station_id

      - name: end_station_id
        description: "Foreign key to dim_stations for the end location."
        tests:
          - relationships:
              to: ref('dim_stations')
              field: station_id

      - name: trip_duration_seconds
        description: "Duration of the trip in seconds."
        tests:
          - not_null

      - name: rider_type
        description: "Degenerate dimension for the type of rider account."
        tests:
          - accepted_values:
              values: ['Subscriber', 'Customer']
              quote: true